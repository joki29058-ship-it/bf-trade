<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BF Trade Market - Исправленные Слоты</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background-color: #121214; color: #ffffff; padding: 15px; }
        header { text-align: center; margin-bottom: 20px; }
        h1 { color: #00e676; font-size: 26px; }
        .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        .card { background: #1a1a1e; border: 1px solid #2d2d34; border-radius: 12px; padding: 20px; }
        h2 { font-size: 18px; margin-bottom: 15px; color: #b3b3b3; }
        
        .seller-stats { display: flex; gap: 10px; background: #222227; border: 1px solid #00e676; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
        .stat-box { flex: 1; text-align: center; }
        .stat-box span { display: block; font-size: 11px; color: #aaa; }
        .stat-box strong { font-size: 16px; color: #00e676; }

        .info-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        input[type="text"], input[type="number"] { background: #2a2a32; color: #fff; border: 1px solid #444; padding: 12px; border-radius: 6px; font-size: 15px; outline: none; width: 100%; }

        .trade-zone { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; }
        .trade-side { flex: 1; min-width: 290px; background: #16161a; padding: 15px; border-radius: 12px; }
        .trade-side.give { border: 2px solid #ff5252; }
        .trade-side.get { border: 2px solid #00e676; }
        
        .slots-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
        
        /* Большие квадратные слоты */
        .fruit-slot { 
            background: #222227; 
            border: 2px dashed #444; 
            border-radius: 10px; 
            padding: 10px; 
            min-height: 95px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            align-items: center;
        }
        .slot-title { font-size: 11px; color: #888; font-weight: bold; margin-bottom: 5px; }
        
        .fruit-slot select { 
            background: #2a2a32; 
            color: #fff; 
            border: 1px solid #666; 
            padding: 12px 5px; 
            border-radius: 6px; 
            font-size: 14px; 
            outline: none; 
            width: 100%; 
            cursor: pointer;
        }

        .main-btn { background: #00e676; color: #000; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; }
        .main-btn:hover { background: #00c864; }
        
        .tabs { display: flex; gap: 10px; }
        .tab-btn { background: #2a2a32; color: #fff; padding: 10px 20px; border-radius: 6px; cursor: pointer; border: 1px solid #444; font-size: 14px; }
        .tab-btn.active { background: #00e676; color: #000; font-weight: bold; }
        .view-section { display: none; }
        .view-section.active { display: block; }
        
        .trade-item { background: #222227; border-left: 4px solid #00e676; padding: 15px; border-radius: 6px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; }
        .trade-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 8px; }
        .seller-info { font-size: 14px; }
        .trade-content { display: flex; justify-content: space-between; align-items: center; }
        .fruits-line { margin: 4px 0; font-size: 15px; }
        
        .trade-action-btn { background: #ff9100; color: #000; padding: 12px 24px; font-size: 15px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #1a1a1e; border: 1px solid #2d2d34; padding: 25px; border-radius: 12px; width: 90%; max-width: 480px; display: flex; flex-direction: column; gap: 15px; }
        .rating-stars { display: flex; gap: 8px; margin: 5px 0; cursor: pointer; }
        .star { font-size: 30px; color: #444; }
        .star.active { color: #ffca28; }

        .chat-container { background: #1a1a1e; border: 1px solid #2d2d34; border-radius: 12px; padding: 20px; height: 400px; display: flex; flex-direction: column; }
        .chat-messages { flex: 1; overflow-y: auto; }
        .sms-item { background: #2a2a32; padding: 12px 15px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; border-left: 4px solid #00b0ff; line-height: 1.5; }
        .sms-item.buyer-offer { border-left-color: #ff9100; background: #222227; }
    </style>
</head>
<body>

<div class="container">
    
    <div class="tabs">
        <div class="tab-btn active" id="market-tab-btn" onclick="switchTab('market')">🛒 Ринок Пропозицій</div>
        <div class="tab-btn" id="sms-tab-btn" onclick="switchTab('sms')">💬 Мої СМС / Чати</div>
    </div>

    <div id="market-section" class="view-section active">
        <div class="seller-stats">
            <div class="stat-box"><span>Ваша роль</span><strong>Учасникі біржі</strong></div>
            <div class="stat-box"><span>Успішні угоди</span><strong id="total-trades-count">0</strong></div>
            <div class="stat-box"><span>Загальна виручка</span><strong id="total-revenue-count">0 $</strong></div>
            <div class="stat-box"><span>Ваш рейтинг</span><strong id="total-rating-value" style="color: #ffca28;">⭐ 5.0</strong></div>
        </div>

        <div class="card">
            <h2>Створити нове оголошення</h2>
            
            <div class="info-inputs">
                <div class="input-group">
                    <label>Ваш нікнейм у Roblox:</label>
                    <input type="text" id="roblox-nick" placeholder="Наприклад, Trade_Master" required>
                </div>
                <div class="input-group">
                    <label>Коли ви вільні для обміну?</label>
                    <input type="text" id="online-time" placeholder="Наприклад: Зараз у грі" required>
                </div>
            </div>

            <div class="trade-zone">
                <!-- СЛОТЫ ОТДАЮ -->
                <div class="trade-side give">
                    <h3 style="font-size: 14px; color: #ff5252; text-align: center;">Я ВІДДАЮ:</h3>
                    <div class="slots-grid">
                        <div class="fruit-slot"><span class="slot-title">Слот 1</span><select id="give-1"><option value="">[Порожньо]</option><option value="Kitsune 🦊">Kitsune 🦊</option><option value="Dragon 🐉">Dragon 🐉</option><option value="Leopard 🐆">Leopard 🐆</option><option value="2x Money 💰">2x Money 💰</option><option value="Dark Blade 🗡️">Dark Blade 🗡️</option></select></div>
                        <div class="fruit-slot"><span class="slot-title">Слот 2</span><select id="give-2"><option value="">[Порожньо]</option><option value="Kitsune 🦊">Kitsune 🦊</option><option value="Dragon 🐉">Dragon 🐉</option><option value="Leopard 🐆">Leopard 🐆</option><option value="2x Money 💰">2x Money 💰</option><option value="Dark Blade 🗡️">Dark Blade 🗡️</option></select></div>
                        <div class="fruit-slot"><span class="slot-title">Слот 3</span><select id="give-3"><option value="">[Порожньо]</option><option value="Kitsune 🦊">Kitsune 🦊</option><option value="Dragon 🐉">Dragon 🐉</option><option value="Leopard 🐆">Leopard 🐆</option><option value="2x Money 💰">2x Money 💰</option><option value="Dark Blade 🗡️">Dark Blade 🗡️</option></select></div>
                        <div class="fruit-slot"><span class="slot-title">Слот 4</span><select id="give-4"><option value="">[Порожньо]</option><option value="Kitsune 🦊">Kitsune 🦊</option><option value="Dragon 🐉">Dragon 🐉</option><option value="Leopard 🐆">Leopard 🐆</option><option value="2x Money 💰">2x Money 💰</option><option value="Dark Blade 🗡️">Dark Blade 🗡️</option></select></div>
                    </div>
                </div>

                <!-- СЛОТЫ ХОЧУ -->
                <div class="trade-side get">
                    <h3 style="font-size: 14px; color: #00e676; text-align: center;">Я ХОЧУ ОТРИМАТИ:</h3>
                    <div class="slots-grid">
                        <div class="fruit-slot"><span class="slot-title">Слот 1</span><select id="get-1"><option value="">[Порожньо]</option><option value="Dragon 🐉">Dragon 🐉</option><option value="Kitsune 🦊">Kitsune 🦊</option><option value="Leopard 🐆">Leopard 🐆</option><option value="2x Money 💰">2x Money 💰</option><option value="Dark Blade 🗡️">Dark Blade 🗡️</option></select></div>
                        <div class="fruit-slot"><span class="slot-title">Слот 2</span><select id="get-2"><option value="">[Порожньо]</option><option value="Dragon 🐉">Dragon 🐉</option><option value="Kitsune 🦊">Kitsune 🦊</option><option value="Leopard 🐆">Leopard 🐆</option><option value="2x Money 💰">2x Money 💰</option><option value="Dark Blade 🗡️">Dark Blade 🗡️</option></select></div>
                        <div class="fruit-slot"><span class="slot-title">Слот 3</span><select id="get-3"><option value="">[Порожньо]</option><option value="Dragon 🐉">Dragon 🐉</option><option value="Kitsune 🦊">Kitsune 🦊</option><option value="Leopard 🐆">Leopard 🐆</option><option value="2x Money 💰">2x Money 💰</option><option value="Dark Blade 🗡️">Dark Blade 🗡️</option></select></div>
