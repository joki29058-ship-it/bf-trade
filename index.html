<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BF Trade Pro 2026</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        
        /* РАЗРЕШАЕМ БЕСКОНЕЧНЫЙ СКРОЛЛ ВНИЗ НА ОДНОЙ СТРАНИЦЕ */
        html, body { height: auto !important; overflow-y: auto !important; background-color: #121214; color: #ffffff; }
        body { padding: 15px; }
        
        .container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; padding-bottom: 250px; }
        
        /* ДИСКОРД ЧАТ СВЕРХУ */
        .discord-container { background: #2f3136; border: 2px solid #5865f2; border-radius: 12px; padding: 15px; width: 100%; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 4px 15px rgba(88,101,242,0.2); }
        .discord-header { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #40444b; padding-bottom: 8px; }
        .discord-avatar { width: 35px; height: 35px; background: #5865f2; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 14px; }
        .discord-status { font-size: 14px; color: #ffffff; font-weight: bold; }
        .discord-status span { color: #3ba55d; font-size: 11px; margin-left: 5px; }
        
        .discord-chat-wall { background: #36393f; border-radius: 8px; padding: 12px; height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg-line { display: flex; flex-direction: column; gap: 2px; font-size: 14px; line-height: 1.4; }
        .msg-author { font-weight: bold; font-size: 13px; }
        .msg-bot { color: #5865f2; }
        .msg-you { color: #00e676; }
        .msg-text { background: rgba(255,255,255,0.05); padding: 6px 10px; border-radius: 6px; display: inline-block; max-width: 90%; }
        
        .discord-input-form { display: flex; gap: 8px; width: 100%; }
        .discord-input { flex: 1; background: #40444b; color: #fff; border: 1px solid #202225; padding: 12px; border-radius: 8px; font-size: 14px; outline: none; }
        .discord-send-btn { background: #5865f2; color: #fff; border: none; padding: 0 20px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 14px; }

        /* КАРТОЧКИ ФОРМЫ */
        .card { background: #1a1a1e; border: 1px solid #2d2d34; border-radius: 12px; padding: 15px; width: 100%; }
        h1 { color: #00e676; font-size: 22px; text-align: center; margin-bottom: 5px; }
        .info-inputs { display: flex; gap: 10px; margin-bottom: 15px; }
        .input-group { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 12px; color: #aaa; font-weight: bold; }
        input[type="text"] { background: #2a2a32; color: #fff; border: 1px solid #444; padding: 14px; border-radius: 8px; font-size: 15px; outline: none; width: 100%; }

        .trade-zone { display: flex; flex-direction: column; gap: 15px; margin-bottom: 15px; width: 100%; }
        .trade-side { background: #16161a; padding: 12px; border-radius: 10px; display: flex; flex-direction: column; gap: 10px; }
        .trade-side.give { border: 2px solid #ff5252; }
        .trade-side.get { border: 2px solid #00e676; }
        .slot-row { display: flex; align-items: center; gap: 10px; background: #222227; padding: 6px 10px; border-radius: 8px; border: 1px solid #333; }
        .slot-row span { font-size: 13px; color: #888; font-weight: bold; width: 60px; }

        /* КНОПКИ */
        .publish-btn { background: #00e676; color: #000; padding: 18px; font-size: 18px; font-weight: bold; border-radius: 8px; text-align: center; width: 100%; margin-top: 10px; border: none; display: block; cursor: pointer; user-select: none; }
        .delete-btn { background: #ff5252; color: #fff; padding: 10px 20px; font-size: 14px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; margin-top: 10px; display: inline-block; }
        .open-chat-btn { background: #5865f2; color: #fff; padding: 10px 18px; font-size: 13px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; margin-top: 8px; display: inline-block; text-decoration: none; }

        /* РЫНОК В САМОМ НИЗУ */
        .chat-container { background: #1a1a1e; border: 1px solid #2d2d34; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .market-item { background: #222227; padding: 12px; border-radius: 8px; margin-bottom: 5px; border-left: 5px solid #ff9100; }
        .market-header { display: flex; justify-content: space-between; font-size: 13px; color: #aaa; margin-bottom: 6px; border-bottom: 1px solid #333; padding-bottom: 4px; }
        .fruits-line { margin: 4px 0; font-size: 15px; }
    </style>
    
    <script>
        // Железобетонная отправка формы с оффером без зависания скриптов
        function submitTradeManual() {
            let nick = document.getElementById('roblox-nick').value.trim() || "Игрок";
            let time = document.getElementById('online-time').value.trim() || "В сети";
            
            let g1 = document.getElementById('give1').value.trim();
            let g2 = document.getElementById('give2').value.trim();
            let g3 = document.getElementById('give3').value.trim();
            let g4 = document.getElementById('give4').value.trim();
            
            let gt1 = document.getElementById('get1').value.trim();
            let gt2 = document.getElementById('get2').value.trim();
            let gt3 = document.getElementById('get3').value.trim();
            let gt4 = document.getElementById('get4').value.trim();

            if (!g1 && !g2 && !g3 && !g4) { alert("Напишите свой фрукт в слоты ОТДАЮ!"); return; }
            if (!gt1 && !gt2 && !gt3 && !gt4) { alert("Напишите фрукт в слоты ПОЛУЧИТЬ!"); return; }
            
            localStorage.setItem('bf_user_nick', nick);
            localStorage.setItem('bf_user_time', time);

            let currentUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
            let targetUrl = currentUrl + "?v=final&has_offer=1&nick=" + encodeURIComponent(nick) + "&time=" + encodeURIComponent(time) +
                            "&g1=" + encodeURIComponent(g1) + "&g2=" + encodeURIComponent(g2) + "&g3=" + encodeURIComponent(g3) + "&g4=" + encodeURIComponent(g4) +
                            "&gt1=" + encodeURIComponent(gt1) + "&gt2=" + encodeURIComponent(gt2) + "&gt3=" + encodeURIComponent(gt3) + "&gt4=" + encodeURIComponent(gt4);
            
            window.location.href = targetUrl;
        }

        function deleteMyOffer() {
            let currentUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
            window.location.href = currentUrl + "?v=final";
        }

        function openLSChat(sellerNick) {
            const params = new URLSearchParams(window.location.search);
            params.set('chat_with', sellerNick);
            params.set('v', 'final');
            window.location.href = window.location.pathname + '?' + params.toString() + '#discord-section';
        }

        window.onload = function() {
            if(document.getElementById('roblox-nick')) {
                document.getElementById('roblox-nick').value = localStorage.getItem('bf_user_nick') || "";
                document.getElementById('online-time').value = localStorage.getItem('bf_user_time') || "";
            }
        }
    </script>
</head>
<body>

<div class="container">
    
    <!-- ================= 1. САМЫЙ ВЕРХ: ВВОД НИКА И ОНЛАЙНА ================= -->
    <div class="card">
        <div class="info-inputs">
            <div class="input-group"><label>Ваш никнейм в Roblox:</label><input type="text" id="roblox-nick" placeholder="Например, Trade_King"></div>
            <div class="input-group"><label>Когда вы свободны для обмена?</label><input type="text" id="online-time" placeholder="Например: Сейчас в сети"></div>
        </div>
    </div>

    <!-- ================= 2. ЛИЧНЫЙ ЧАТ DISCORD (ОТПРАВКА СМС БЕЗ БАГОВ) ================= -->
    <div class="discord-container" id="discord-section">
        <div class="discord-header">
            <div class="discord-avatar">💬</div>
            <div class="discord-status">
                ЛС: <span id="chat-target-name" style="color:#fff; font-size:14px; margin:0;">FruitTrader_2026</span> <span>● онлайн</span>
                <script>
                    const urlParamsName = new URLSearchParams(window.location.search);
                    const currentChatPartner = urlParamsName.get('chat_with');
                    if (currentChatPartner) { document.getElementById('chat-target-name').innerText = currentChatPartner; }
                </script>
            </div>
        </div>
        
        <div class="discord-chat-wall">
            <script>
                const chatParams = new URLSearchParams(window.location.search);
                const partner = chatParams.get('chat_with') || "FruitTrader_2026";
                document.write(`
                    <div class="msg-line">
                        <span class="msg-author msg-bot">${partner}:</span>
                        <span class="msg-text">Привет! Увидел твой оффер на рынке. Предложение актуально? Зайди в игру! 🎮</span>
                    </div>
                `);
                
                const replyText = chatParams.get('discord_msg');
                if (replyText) {
                    document.write(`
                        <div class="msg-line">
                            <span class="msg-author msg-you">Вы:</span>
                            <span class="msg-text" style="background: rgba(0,230,118,0.1); border-left: 2px solid #00e676;">${replyText}</span>
