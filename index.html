<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BF Trade Pro 2026</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background-color: #121214; color: #ffffff; padding: 15px; }
        .container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        
        .card { background: #1a1a1e; border: 1px solid #2d2d34; border-radius: 12px; padding: 15px; width: 100%; }
        h1 { color: #00e676; font-size: 24px; text-align: center; margin-bottom: 5px; }
        h2 { font-size: 14px; color: #aaa; margin-bottom: 15px; text-align: center; }

        .info-inputs { display: flex; gap: 10px; margin-bottom: 15px; }
        .input-group { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 12px; color: #aaa; font-weight: bold; }
        
        /* КРУПНЫЕ ТЕКСТОВЫЕ ПОЛЯ ДЛЯ КЛАВИАТУРЫ */
        input[type="text"], input[type="number"] { background: #2a2a32; color: #fff; border: 1px solid #444; padding: 14px; border-radius: 8px; font-size: 15px; outline: none; width: 100%; }
        input[type="text"]:focus { border-color: #00e676; }

        .trade-zone { display: flex; flex-direction: column; gap: 15px; margin-bottom: 15px; }
        .trade-side { background: #16161a; padding: 12px; border-radius: 10px; display: flex; flex-direction: column; gap: 10px; }
        .trade-side.give { border: 2px solid #ff5252; }
        .trade-side.get { border: 2px solid #00e676; }
        
        .slot-row { display: flex; align-items: center; gap: 10px; background: #222227; padding: 6px 10px; border-radius: 8px; border: 1px solid #333; }
        .slot-row span { font-size: 13px; color: #888; font-weight: bold; width: 60px; }

        /* ЖЕЛЕЗОБЕТОННАЯ КНОПКА ОТПРАВКИ ФОРМЫ */
        .publish-btn { background: #00e676; color: #000; padding: 18px; font-size: 18px; font-weight: bold; border-radius: 8px; text-align: center; width: 100%; margin-top: 10px; border: none; display: block; cursor: pointer; box-shadow: 0 4px 10px rgba(0,230,118,0.2); }
        .publish-btn:active { background: #00c864; }

        /* СПИСОК ОБЪЯВЛЕНИЙ НА РЫНКЕ */
        .chat-container { background: #1a1a1e; border: 1px solid #2d2d34; border-radius: 12px; padding: 15px; min-height: 350px; display: flex; flex-direction: column; gap: 12px; }
        .market-item { background: #222227; border-left: 4px solid #ff9100; padding: 12px; border-radius: 8px; margin-bottom: 5px; }
        .market-header { display: flex; justify-content: space-between; font-size: 13px; color: #aaa; margin-bottom: 6px; border-bottom: 1px solid #333; padding-bottom: 4px; }
        .fruits-line { margin: 3px 0; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- ФОРМА СОЗДАНИЯ ОБЪЯВЛЕНИЯ -->
    <div class="card">
        <h1>BF Fruit & Gamepass Market 2026</h1>
        <h2>Тапай пальцем в Слоты и сам пиши любые фрукты или геймпасы с клавиатуры!</h2>
        
        <!-- Родная браузерная форма. При нажатии на кнопку страница гарантированно перезагрузится и обновит список -->
        <form method="GET">
            <div class="info-inputs">
                <div class="input-group">
                    <label>Ваш никнейм в Roblox:</label>
                    <input type="text" name="nick" placeholder="Например, Trade_King">
                </div>
                <div class="input-group">
                    <label>Когда вы свободны для обмена?</label>
                    <input type="text" name="time" placeholder="Например: Сейчас в сети">
                </div>
            </div>

            <div class="trade-zone">
                <!-- СЛОТЫ Я ОТДАЮ -->
                <div class="trade-side give">
                    <h3 style="color: #ff5252; margin-bottom:5px; font-size: 14px; text-align: center; font-weight: bold;">Я ОТДАЮ (ПИШИ РУКАМИ):</h3>
                    <div class="slot-row"><span>Слот 1</span><input type="text" name="give1" placeholder="Напиши фрукт или пас"></div>
                    <div class="slot-row"><span>Слот 2</span><input type="text" name="give2" placeholder="Напиши фрукт или пас"></div>
                    <div class="slot-row"><span>Слот 3</span><input type="text" name="give3" placeholder="Напиши фрукт или пас"></div>
                    <div class="slot-row"><span>Слот 4</span><input type="text" name="give4" placeholder="Напиши фрукт или пас"></div>
                </div>

                <!-- СЛОТЫ Я ХОЧУ -->
                <div class="trade-side get">
                    <h3 style="color: #00e676; margin-bottom:5px; font-size: 14px; text-align: center; font-weight: bold;">Я ХОЧУ ПОЛУЧИТЬ (ПИШИ РУКАМИ):</h3>
                    <div class="slot-row"><span>Слот 1</span><input type="text" name="get1" placeholder="Напиши фрукт или пас"></div>
                    <div class="slot-row"><span>Слот 2</span><input type="text" name="get2" placeholder="Напиши фрукт или пас"></div>
                    <div class="slot-row"><span>Слот 3</span><input type="text" name="get3" placeholder="Напиши фрукт или пас"></div>
                    <div class="slot-row"><span>Слот 4</span><input type="text" name="get4" placeholder="Напиши фрукт или пас"></div>
                </div>
            </div>
            
            <button type="submit" class="publish-btn">Опубликовать Трейд на рынок</button>
        </form>
    </div>

    <!-- ЛЕНТА АКТИВНЫХ ОБЪЯВЛЕНИЙ НА РЫНКЕ -->
    <div class="chat-container">
        <h2 style="color: #00e676; text-align: left; font-size: 18px; font-weight: bold;">🛒 Активные предложения на рынке:</h2>
        <div id="market-list">
            <!-- Скрипт ниже просто разбирает адресную строку и выводит твои написанные фрукты без JavaScript-ошибок -->
            <script>
                const urlParams = new URLSearchParams(window.location.search);
                const nick = urlParams.get('nick') || "Аноним";
                const time = urlParams.get('time') || "В сети прямо сейчас";
                
                let giveArr = [urlParams.get('give1'), urlParams.get('give2'), urlParams.get('give3'), urlParams.get('give4')].filter(Boolean);
                let getArr = [urlParams.get('get1'), urlParams.get('get2'), urlParams.get('get3'), urlParams.get('get4')].filter(Boolean);

                let userOfferHTML = "";
                if (giveArr.length > 0 && getArr.length > 0) {
                    userOfferHTML = `
                        <div class="market-item" style="border-left-color: #00e676;">
                            <div class="market-header">
                                <span>👤 Продавец: <b style="color: #00e676;">${nick} (Вы)</b></span>
                                <span>⏰ Онлайн: ${time}</span>
                            </div>
                            <div class="fruits-line">Отдаёт: <span style="color:#ff5252; font-weight:bold;">${giveArr.join(" + ")}</span></div>
                            <div class="fruits-line">Хочет получить: <span style="color:#00e676; font-weight:bold;">${getArr.join(" + ")}</span></div>
                        </div>
                    `;
                }

                // Готовые примеры на рынке на 2026 год, чтобы лента была живой
                let defaultOffers = `
                    ${userOfferHTML}
                    <div class="market-item">
                        <div class="market-header">
                            <span>👤 Продавец: <b style="color:#ff9100;">RobloxKing_BF</b></span>
                            <span>⏰ Онлайн: Свободен весь день</span>
                        </div>
                        <div class="fruits-line">Отдаёт: <span style="color:#ff5252; font-weight:bold;">Perm Yeti 💎 + Kitsune 🦊</span></div>
                        <div class="fruits-line">Хочет получить: <span style="color:#00e676; font-weight:bold;">Dark Blade 🗡️ + Dragon (Rework) 🐉</span></div>
                    </div>
                    <div class="market-item">
                        <div class="market-header">
                            <span>👤 Продавец: <b style="color:#ff9100;">FruitDealer_2026</b></span>
                            <span>⏰ Онлайн: Сейчас в игре</span>
                        </div>
                        <div class="fruits-line">Отдаёт: <span style="color:#ff5252; font-weight:bold;">2x Money 💰 + Gas 💨 + Dough 🍩</span></div>
                        <div class="fruits-line">Хочет получить: <span style="color:#00e676; font-weight:bold;">Leopard 🐆 + Buddha 👑</span></div>
                    </div>
                `;
                document.getElementById('market-list').innerHTML = defaultOffers;
            </script>
        </div>
    </div>
</div>

</body>
</html>
