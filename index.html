<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BF Полный Маркет 2026</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background-color: #121214; color: #ffffff; padding: 15px; }
        .container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        
        .card { background: #1a1a1e; border: 1px solid #2d2d34; border-radius: 12px; padding: 15px; width: 100%; }
        h1 { color: #00e676; font-size: 24px; text-align: center; margin-bottom: 5px; }
        h2 { font-size: 15px; color: #aaa; margin-bottom: 15px; text-align: center; }

        .info-inputs { display: flex; gap: 10px; margin-bottom: 15px; }
        .input-group { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        input[type="text"] { background: #2a2a32; color: #fff; border: 1px solid #444; padding: 12px; border-radius: 6px; font-size: 15px; outline: none; width: 100%; }

        .trade-zone { display: flex; flex-direction: column; gap: 15px; margin-bottom: 15px; }
        .trade-side { background: #16161a; padding: 12px; border-radius: 10px; display: flex; flex-direction: column; gap: 10px; }
        .trade-side.give { border: 2px solid #ff5252; }
        .trade-side.get { border: 2px solid #00e676; }
        
        .slot-row { display: flex; align-items: center; gap: 10px; background: #222227; padding: 8px; border-radius: 8px; }
        .slot-row span { font-size: 13px; color: #888; font-weight: bold; width: 60px; }
        
        /* ВЫПАДАЮЩИЙ СПИСОК ПРЕДМЕТОВ */
        .slot-row select { background: #2a2a32; color: #fff; border: 1px solid #555; padding: 12px; border-radius: 6px; font-size: 15px; outline: none; flex: 1; cursor: pointer; display: block !important; }

        .publish-btn { background: #00e676; color: #000; padding: 18px; font-size: 18px; font-weight: bold; border-radius: 8px; text-align: center; cursor: pointer; width: 100%; margin-top: 10px; border: none; display: block; user-select: none; }
        .trade-action-btn { background: #ff9100; color: #000; padding: 10px 20px; font-size: 14px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; }

        .chat-container { background: #1a1a1e; border: 1px solid #2d2d34; border-radius: 12px; padding: 15px; min-height: 350px; display: flex; flex-direction: column; gap: 12px; }
        .market-item { background: #222227; border-left: 4px solid #ff5252; padding: 12px; border-radius: 8px; margin-bottom: 5px; }
        .market-header { display: flex; justify-content: space-between; font-size: 13px; color: #aaa; margin-bottom: 6px; border-bottom: 1px solid #333; padding-bottom: 4px; }
        .market-content { display: flex; justify-content: space-between; align-items: center; }
        .fruits-line { margin: 3px 0; font-size: 14px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 999; }
        .modal-content { background: #1a1a1e; border: 1px solid #2d2d34; padding: 25px; border-radius: 12px; width: 95%; max-width: 450px; display: flex; flex-direction: column; gap: 15px; }
    </style>
</head>
<body>

<div class="container">
    
    <div class="card">
        <h1>BF Fruit & Gamepass Market</h1>
        <h2>Выберите предметы, введите ник и нажмите кнопку публикации ниже!</h2>
        
        <form action="#sms-section" method="GET" onsubmit="return saveTradeManual()">
            <div class="info-inputs">
                <div class="input-group">
                    <label>Ваш никнейм в Roblox:</label>
                    <input type="text" id="roblox-nick" placeholder="Например, Pro_Gamer2026">
                </div>
                <div class="input-group">
                    <label>Когда вы свободны для обмена?</label>
                    <input type="text" id="online-time" placeholder="Например: Сейчас в игре">
                </div>
            </div>

            <div class="trade-zone">
                <!-- СЛОТЫ ОТДАЮ -->
                <div class="trade-side give">
                    <h3 style="color: #ff5252; margin-bottom:5px; font-size: 14px; text-align: center;">Я ОТДАЮ:</h3>
                    <div class="slot-row"><span>Слот 1</span><select id="give-1"></select></div>
                    <div class="slot-row"><span>Слот 2</span><select id="give-2"></select></div>
                    <div class="slot-row"><span>Слот 3</span><select id="give-3"></select></div>
                    <div class="slot-row"><span>Слот 4</span><select id="give-4"></select></div>
                </div>

                <!-- СЛОТЫ ХОЧУ -->
                <div class="trade-side get">
                    <h3 style="color: #00e676; margin-bottom:5px; font-size: 14px; text-align: center;">Я ХОЧУ ПОЛУЧИТЬ:</h3>
                    <div class="slot-row"><span>Слот 1</span><select id="get-1"></select></div>
                    <div class="slot-row"><span>Слот 2</span><select id="get-2"></select></div>
                    <div class="slot-row"><span>Слот 3</span><select id="get-3"></select></div>
                    <div class="slot-row"><span>Слот 4</span><select id="get-4"></select></div>
                </div>
            </div>
            
            <button type="submit" class="publish-btn">Опубликовать предложение на рынок</button>
        </form>
    </div>

    <!-- ТАБЛИЦА ОБЪЯВЛЕНИЙ -->
    <div class="chat-container" id="sms-section">
        <h2 style="color: #00e676; text-align: left; font-size: 17px;">🛒 Активные предложения на рынке и отзывы:</h2>
        <div id="market-list"></div>
    </div>
</div>

<div class="modal" id="trade-modal">
    <div class="modal-content">
        <h3>🤝 Оформить ответный Трейд</h3>
        <p id="modal-seller-info" style="color: #aaa; font-size:14px; margin-bottom: 5px;"></p>
        <div class="input-group"><label>Ваш отзыв или предложение:</label><input type="text" id="buyer-note" placeholder="Например: Готов обменять!"></div>
        <div class="input-group"><label>Какую выручку перечислить ($):</label><input type="number" id="buyer-cash" placeholder="Сумма"></div>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button class="publish-btn" style="background: #ff9100; margin: 0; flex: 1; padding: 12px;" onclick="submitBuyerTradeHTML()">Отправить ответ</button>
            <button class="publish-btn" style="background: #444; color: #fff; margin: 0; flex: 1; padding: 12px;" onclick="closeModal()">Отмена</button>
        </div>
    </div>
</div>
