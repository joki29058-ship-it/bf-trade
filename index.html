<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BF Trade Single</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background-color: #121214; color: #ffffff; padding: 15px; }
        .container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        
        .card { background: #1a1a1e; border: 1px solid #2d2d34; border-radius: 12px; padding: 15px; width: 100%; }
        h1 { color: #00e676; font-size: 24px; text-align: center; margin-bottom: 5px; }
        h2 { font-size: 16px; color: #aaa; margin-bottom: 15px; }

        .info-inputs { display: flex; gap: 10px; margin-bottom: 15px; }
        .input-group { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        input[type="text"] { background: #2a2a32; color: #fff; border: 1px solid #444; padding: 12px; border-radius: 6px; font-size: 15px; outline: none; width: 100%; }

        .trade-zone { display: flex; flex-direction: column; gap: 15px; margin-bottom: 15px; }
        .trade-side { background: #16161a; padding: 12px; border-radius: 10px; display: flex; flex-direction: column; gap: 10px; }
        .trade-side.give { border: 2px solid #ff5252; }
        .trade-side.get { border: 2px solid #00e676; }
        
        .slot-row { display: flex; align-items: center; gap: 10px; background: #222227; padding: 8px; border-radius: 8px; }
        .slot-row span { font-size: 13px; color: #888; font-weight: bold; width: 60px; }
        
        /* КРУПНЫЕ СЕЛЕКТОРЫ - ТЕПЕРЬ ОНИ ТОЧНО ОТКРОЮТСЯ */
        .slot-row select { background: #2a2a32; color: #fff; border: 1px solid #555; padding: 12px; border-radius: 6px; font-size: 15px; outline: none; flex: 1; cursor: pointer; display: block !important; }

        /* ЧИСТАЯ ФОРМА ДЛЯ СРАБАТЫВАНИЯ БЕЗ СКРИПТОВ */
        .publish-btn { background: #00e676; color: #000; padding: 18px; font-size: 18px; font-weight: bold; border-radius: 8px; text-align: center; cursor: pointer; width: 100%; margin-top: 10px; border: none; display: block; }

        .chat-container { background: #1a1a1e; border: 1px solid #2d2d34; border-radius: 12px; padding: 15px; min-height: 250px; display: flex; flex-direction: column; }
        .sms-item { background: #2a2a32; padding: 12px; border-radius: 8px; margin-bottom: 8px; font-size: 14px; border-left: 4px solid #00b0ff; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    
    <div class="card">
        <h1>BF Fruit Market Pro</h1>
        <h2 style="text-align: center;">Всё на одной странице — без переключения вкладок!</h2>
        
        <!-- Чистая HTML-форма, отправляет данные без JavaScript -->
        <form action="#sms-section" method="GET" onsubmit="return saveTradeManual()">
            <div class="info-inputs">
                <div class="input-group">
                    <label>Ваш никнейм в Roblox:</label>
                    <input type="text" id="roblox-nick" placeholder="Например, Trade_Master">
                </div>
                <div class="input-group">
                    <label>Когда вы свободны для обмена?</label>
                    <input type="text" id="online-time" placeholder="Например: Сейчас в игре">
                </div>
            </div>

            <div class="trade-zone">
                <!-- СЛОТЫ ОТДАЮ -->
                <div class="trade-side give">
                    <h3 style="color: #ff5252; margin-bottom:5px; font-size: 14px; text-align: center;">Я ОТДАЮ:</h3>
                    <div class="slot-row"><span>Слот 1</span><select id="give-1"><option value="">[Пусто]</option><option value="Kitsune 🦊">Kitsune 🦊</option><option value="Dragon 🐉">Dragon 🐉</option><option value="Leopard 🐆">Leopard 🐆</option><option value="2x Money 💰">2x Money 💰</option><option value="Dark Blade 🗡️">Dark Blade 🗡️</option></select></div>
                    <div class="slot-row"><span>Слот 2</span><select id="give-2"><option value="">[Пусто]</option><option value="Kitsune 🦊">Kitsune 🦊</option><option value="Dragon 🐉">Dragon 🐉</option><option value="Leopard 🐆">Leopard 🐆</option><option value="2x Money 💰">2x Money 💰</option><option value="Dark Blade 🗡️">Dark Blade 🗡️</option></select></div>
                    <div class="slot-row"><span>Слот 3</span><select id="give-3"><option value="">[Пусто]</option><option value="Kitsune 🦊">Kitsune 🦊</option><option value="Dragon 🐉">Dragon 🐉</option><option value="Leopard 🐆">Leopard 🐆</option><option value="2x Money 💰">2x Money 💰</option><option value="Dark Blade 🗡️">Dark Blade 🗡️</option></select></div>
                    <div class="slot-row"><span>Слот 4</span><select id="give-4"><option value="">[Пусто]</option><option value="Kitsune 🦊">Kitsune 🦊</option><option value="Dragon 🐉">Dragon 🐉</option><option value="Leopard 🐆">Leopard 🐆</option><option value="2x Money 💰">2x Money 💰</option><option value="Dark Blade 🗡️">Dark Blade 🗡️</option></select></div>
                </div>

                <!-- СЛОТЫ ХОЧУ -->
                <div class="trade-side get">
                    <h3 style="color: #00e676; margin-bottom:5px; font-size: 14px; text-align: center;">Я ХОЧУ ПОЛУЧИТЬ:</h3>
                    <div class="slot-row"><span>Слот 1</span><select id="get-1"><option value="">[Пусто]</option><option value="Dragon 🐉">Dragon 🐉</option><option value="Kitsune 🦊">Kitsune 🦊</option><option value="Leopard 🐆">Leopard 🐆</option><option value="2x Money 💰">2x Money 💰</option><option value="Dark Blade 🗡️">Dark Blade 🗡️</option></select></div>
                    <div class="slot-row"><span>Слот 2</span><select id="get-2"><option value="">[Пусто]</option><option value="Dragon 🐉">Dragon 🐉</option><option value="Kitsune 🦊">Kitsune 🦊</option><option value="Leopard 🐆">Leopard 🐆</option><option value="2x Money 💰">2x Money 💰</option><option value="Dark Blade 🗡️">Dark Blade 🗡️</option></select></div>
                    <div class="slot-row"><span>Слот 3</span><select id="get-3"><option value="">[Пусто]</option><option value="Dragon 🐉">Dragon 🐉</option><option value="Kitsune 🦊">Kitsune 🦊</option><option value="Leopard 🐆">Leopard 🐆</option><option value="2x Money 💰">2x Money 💰</option><option value="Dark Blade 🗡️">Dark Blade 🗡️</option></select></div>
                    <div class="slot-row"><span>Слот 4</span><select id="get-4"><option value="">[Пусто]</option><option value="Dragon 🐉">Dragon 🐉</option><option value="Kitsune 🦊">Kitsune 🦊</option><option value="Leopard 🐆">Leopard 🐆</option><option value="2x Money 💰">2x Money 💰</option><option value="Dark Blade 🗡️">Dark Blade 🗡️</option></select></div>
                </div>
            </div>
            
            <button type="submit" class="publish-btn">Опубликовать Трейд</button>
        </form>
    </div>

    <!-- СМС ЛЕНТА СРАЗУ ВНИЗУ СТРАНИЦЫ -->
    <div class="chat-container" id="sms-section">
        <h2 style="color: #00b0ff;">💬 Лента угод и СМС-сообщения:</h2>
        <div id="sms-list">
            <div class="sms-item">Пока нет созданных трейдов. Выберите фрукты выше и нажмите «Опубликовать Трейд».</div>
        </div>
    </div>
</div>

<script>
    function saveTradeManual() {
        let nick = document.getElementById('roblox-nick').value.trim() || "Игрок";
        let time = document.getElementById('online-time').value.trim() || "Сейчас в игре";
        
        let giveFruits = [document.getElementById('give-1').value, document.getElementById('give-2').value, document.getElementById('give-3').value, document.getElementById('give-4').value].filter(f => f !== "");
        let getFruits = [document.getElementById('get-1').value, document.getElementById('get-2').value, document.getElementById('get-3').value, document.getElementById('get-4').value].filter(f => f !== "");

        if (giveFruits.length === 0 || getFruits.length === 0) {
            alert("Выберите хотя бы по 1 предмету!");
            return false;
        }

        let newLog = `<div class="sms-item">📢 <b>Новая сделка создана!</b><br>👤 Ник продавца: <b>${nick}</b> | ⏰ Время: <i>${time}</i><br>📤 Отдает: <span style="color:#ff5252">${giveFruits.join(" + ")}</span><br>📥 Хочет получить: <span style="color:#00e676">${getFruits.join(" + ")}</span></div>`;
        
        let oldLogs = localStorage.getItem('bf_single_logs') || "";
        localStorage.setItem('bf_single_logs', newLog + oldLogs);
        
        loadLogs();
        return false; // Предотвращает перезагрузку страницы
    }

    function loadLogs() {
        let saved = localStorage.getItem('bf_single_logs');
        if (saved) {
            document.getElementById('sms-list').innerHTML = saved;
        }
    }
    loadLogs();
</script>
</body>
</html>
