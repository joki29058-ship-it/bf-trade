<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BF Trade Pro</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background-color: #121214; color: #ffffff; padding: 15px; }
        .container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        
        /* СВЕРХНАДЕЖНЫЕ ТЕГИ КНОПОК */
        .tabs { display: flex; gap: 10px; width: 100%; }
        .tab-btn { flex: 1; background: #2a2a32; color: #fff; padding: 18px; border-radius: 8px; text-align: center; font-size: 16px; font-weight: bold; border: 2px solid #444; cursor: pointer; text-decoration: none; display: block; }
        .tab-btn.active { background: #00e676; color: #000; border-color: #00e676; }

        .card { background: #1a1a1e; border: 1px solid #2d2d34; border-radius: 12px; padding: 15px; }
        .info-inputs { display: flex; gap: 10px; margin-bottom: 15px; }
        .input-group { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        input[type="text"] { background: #2a2a32; color: #fff; border: 1px solid #444; padding: 12px; border-radius: 6px; font-size: 15px; outline: none; }

        .trade-zone { display: flex; flex-direction: column; gap: 15px; margin-bottom: 15px; }
        .trade-side { background: #16161a; padding: 12px; border-radius: 10px; display: flex; flex-direction: column; gap: 10px; }
        .trade-side.give { border: 2px solid #ff5252; }
        .trade-side.get { border: 2px solid #00e676; }
        
        .slot-row { display: flex; align-items: center; gap: 10px; background: #222227; padding: 8px; border-radius: 8px; }
        .slot-row span { font-size: 13px; color: #888; font-weight: bold; width: 60px; }
        .slot-row select { background: #2a2a32; color: #fff; border: 1px solid #555; padding: 12px; border-radius: 6px; font-size: 15px; outline: none; flex: 1; cursor: pointer; }

        .publish-btn { background: #00e676; color: #000; padding: 18px; font-size: 18px; font-weight: bold; border-radius: 8px; text-align: center; cursor: pointer; width: 100%; margin-top: 10px; text-decoration: none; display: block; box-shadow: 0 4px 10px rgba(0,230,118,0.2); }

        .view-section { display: none; }
        .view-section.active { display: block; }
        
        .trade-item { background: #222227; border-left: 4px solid #00e676; padding: 15px; border-radius: 8px; margin-bottom: 12px; }
        .trade-header { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 6px; }
        .trade-content { display: flex; justify-content: space-between; align-items: center; }
        .trade-action-btn { background: #ff9100; color: #000; padding: 12px 22px; font-size: 14px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; text-decoration: none; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 999; }
        .modal-content { background: #1a1a1e; border: 1px solid #2d2d34; padding: 25px; border-radius: 12px; width: 95%; max-width: 450px; display: flex; flex-direction: column; gap: 15px; }

        .chat-container { background: #1a1a1e; border: 1px solid #2d2d34; border-radius: 12px; padding: 15px; height: 400px; display: flex; flex-direction: column; }
        .chat-messages { flex: 1; overflow-y: auto; }
        .sms-item { background: #2a2a32; padding: 12px; border-radius: 8px; margin-bottom: 8px; font-size: 14px; border-left: 4px solid #00b0ff; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- КНОПКИ ВКЛАДОК -->
    <div class="tabs">
        <a class="tab-btn active" id="market-tab-btn" onclick="switchTab('market')">🛒 Рынок Предложений</a>
        <a class="tab-btn" id="sms-tab-btn" onclick="switchTab('sms')">💬 Мои СМС / Чаты</a>
    </div>

    <!-- РЫНОК -->
    <div id="market-section" class="view-section active">
        <div class="card" style="margin-top:10px;">
            <div class="info-inputs">
                <div class="input-group">
                    <label>Ваш никнейм в Roblox:</label>
                    <input type="text" id="roblox-nick" placeholder="Например, Trade_Master">
                </div>
                <div class="input-group">
                    <label>Когда вы свободны для обмена?</label>
                    <input type="text" id="online-time" placeholder="Например: Сейчас в игре">
                </div>
            </div>

            <div class="trade-zone">
                <!-- СЛОТЫ ОТДАЮ -->
                <div class="trade-side give">
                    <h3 style="color: #ff5252; margin-bottom:5px; font-size: 14px; text-align: center;">Я ОТДАЮ:</h3>
                    <div class="slot-row"><span>Слот 1</span><select id="give-1"></select></div>
                    <div class="slot-row"><span>Слот 2</span><select id="give-2"></select></div>
                    <div class="slot-row"><span>Слот 3</span><select id="give-3"></select></div>
                    <div class="slot-row"><span>Слот 4</span><select id="give-4"></select></div>
                </div>

                <!-- СЛОТЫ ХОЧУ -->
                <div class="trade-side get">
                    <h3 style="color: #00e676; margin-bottom:5px; font-size: 14px; text-align: center;">Я ХОЧУ ПОЛУЧИТЬ:</h3>
                    <div class="slot-row"><span>Слот 1</span><select id="get-1"></select></div>
                    <div class="slot-row"><span>Слот 2</span><select id="get-2"></select></div>
                    <div class="slot-row"><span>Слот 3</span><select id="get-3"></select></div>
                    <div class="slot-row"><span>Слот 4</span><select id="get-4"></select></div>
                </div>
            </div>
                
            <!-- КНОПКА ПУБЛИКАЦИИ -->
            <a class="publish-btn" onclick="createMarketOffer()">Опубликовать на рынок</a>
        </div>

        <div class="card" style="margin-top: 15px;">
            <h2>Активные объявления на рынке</h2>
            <div id="trades-list"></div>
        </div>
    </div>

    <!-- СМС ЧАТ -->
    <div id="sms-section" class="view-section">
        <div class="chat-container">
            <h2>Входящие СМС-предложения от покупателей</h2>
            <div class="chat-messages" id="sms-list"></div>
        </div>
    </div>
</div>

<div class="modal" id="trade-modal">
    <div class="modal-content">
        <h3>🤝 Оформить Трейд</h3>
        <p id="modal-seller-info" style="color: #aaa; font-size:14px;"></p>
        <div class="input-group"><label>Ваше Письмо продавцу:</label><input type="text" id="buyer-note" placeholder="Например: Готов обменять!"></div>
        <div class="input-group"><label>Какую выручку получит продавец ($):</label><input type="number" id="buyer-cash" placeholder="Сума сделки"></div>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <a class="publish-btn" style="background: #ff9100; margin: 0; flex: 1; padding: 12px;" onclick="submitBuyerTrade()">Отправить</a>
            <a class="publish-btn" style="background: #444; color: #fff; margin: 0; flex: 1; padding: 12px;" onclick="closeModal()">Отмена</a>
        </div>
    </div>
</div>

<script>
